# 手元の開発で使う DB とメールの受信箱。本番では使わない
# 起動: docker compose up -d ／ 止める: docker compose stop（down -v は DB の中身も消す）
name: matching-db-study

services:
  app:
    build: ./docker/php
    # リポジトリ全体を /app に置く。Laravel は /app/backend
    volumes:
      - .:/app
      - composer-cache:/root/.composer/cache
    ports:
      - "127.0.0.1:8000:8000"
    # 接続先は環境変数で渡す。Laravel は、環境変数があると .env の値より優先する
    # どれも手元だけの捨ててよい値（db と同じ）。秘密の値（APP_KEY など）はここに書かない
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: matching_dev
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      # 05c：Firestore の Emulator の場所（compose の中の名前）。本物の Firebase にはつながない。秘密の値ではない
      FIRESTORE_EMULATOR_HOST: firebase:8080
      FIREBASE_PROJECT_ID: demo-matching
    # php artisan serve は環境変数の多くを子のプロセスに渡さず .env を読み直すので、上の接続先が届かない。
    # そのため、artisan serve が中で使う PHP の組み込みサーバーを直接起動する（server.php は今いるフォルダを public として扱う）
    command: sh -c "cd public && exec php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
    depends_on:
      db:
        condition: service_healthy


  # 12：管理画面の API（admin/backend の Laravel）。会員の側（app）と同じ PHP のイメージで、別のコンテナ・別のポート。
  # 表は会員の側と共通（同じ DB の matching_dev）。表の作り（マイグレーション）は backend/ にまとめ、管理画面では流さない
  admin-app:
    build: ./docker/php
    volumes:
      - .:/app
      - composer-cache:/root/.composer/cache
    working_dir: /app/admin/backend
    ports:
      - "127.0.0.1:8100:8000"
    # どれも手元だけの捨ててよい値（app と同じ）。秘密の値（APP_KEY など）はここに書かない
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: matching_dev
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # キャッシュ・セッション・キューを DB の表に置かない（会員の側の cache・sessions・jobs の表を共有しないため）
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    # app と同じく、PHP の組み込みのサーバーを直接起動する（環境変数を子のプロセスに渡すため）
    command: sh -c "cd public && exec php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18.6
    # ポートは手元の PC からだけ開ける（127.0.0.1）。5432 は手元の PostgreSQL とぶつかるので 55432 にする
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      # 手元だけの、捨ててよい値。外に開かないので秘密の値として扱わない
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # 開発用の DB。テスト用（matching_test）は docker/db/init の SQL で作る
      POSTGRES_DB: matching_dev
    # クエリごとの回数・時間を集める拡張（pg_stat_statements）を読み込む
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
    volumes:
      # PostgreSQL 18 のイメージは、/var/lib/postgresql に置くのが決まり
      - db-data:/var/lib/postgresql
      # ボリュームが空のとき（最初の1回）だけ流れる
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matching_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.1
    # 1025・8025 は手元ですでに使われているので、ずらす
    ports:
      - "127.0.0.1:51025:1025" # SMTP（Laravel がメールを送る先）
      - "127.0.0.1:58025:8025" # 受信箱の画面

  # 05c：Firebase Emulator（手元の Firestore と Auth）。プロジェクトの ID が demo- で始まるので、本物にはつながらない。
  # データは止めるときに firebase/.emulator-data に書き出し、次に起動したときに読み込む（書き出しがまだなければ読み込まない）。
  # Emulator は今いるフォルダに書いてから移すので、書き出し先も同じ bind mount の中にする（ボリュームだと移せずに失敗する）
  firebase:
    build: ./docker/firebase
    volumes:
      - ./firebase:/app/firebase
    command: >
      sh -c 'if [ -f .emulator-data/firebase-export-metadata.json ]; then IMPORT="--import .emulator-data"; fi;
      exec firebase emulators:start --project demo-matching --only firestore,auth $$IMPORT --export-on-exit .emulator-data'
    # 止めるとき（SIGTERM）に書き出すので、少し待つ
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8080:8080" # Firestore（画面が直接つなぐ）
      - "127.0.0.1:9099:9099" # Auth
      - "127.0.0.1:4000:4000" # Emulator の画面
      - "127.0.0.1:4400:4400" # Emulator どうしをつなぐハブ（画面が使う）
      - "127.0.0.1:4500:4500" # ログ（画面が使う）
      - "127.0.0.1:9150:9150" # Emulator の画面が Firestore の変化を受け取る
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080').then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  db-data:
  composer-cache:
