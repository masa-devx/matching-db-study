# 12 管理画面の API（backend/admin の Laravel）の CI。会員の側（backend.yml）とは別に、backend/admin だけを見る
# レガシー版はテストを書かないので、整形（Pint）と静的解析（Larastan）だけ
name: admin-backend

on:
  pull_request:
    branches: [legacy-repo, refactored-repo]
    paths:
      - "backend/admin/**"
      - ".github/workflows/admin-backend.yml"
  push:
    branches: [legacy-repo, refactored-repo, "legacy/**", "refactor/**"]
    paths:
      - "backend/admin/**"
      - ".github/workflows/admin-backend.yml"

# 同じブランチで続けて push したら、前の実行は止める
concurrency:
  group: admin-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend/admin

env:
  PHP_VERSION: "8.5"
  PHP_EXTENSIONS: pdo_pgsql, intl, zip

jobs:
  pint:
    name: 管理画面 整形の確かめ（Pint）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: actions/cache@v4
        with:
          path: backend/admin/vendor
          key: admin-vendor-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('backend/admin/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: ./vendor/bin/pint --test

  phpstan:
    name: 管理画面 静的解析（PHPStan）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: actions/cache@v4
        with:
          path: backend/admin/vendor
          key: admin-vendor-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('backend/admin/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress
